name: CPA Management HTML Release

on:
  push:
    branches:
      - CPA-UI-fork
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build management HTML
        run: bun run build
        env:
          VERSION: ${{ github.sha }}

      - name: Prepare release asset
        run: |
          mv dist/index.html dist/management.html
          ls -lh dist/management.html

      - name: Generate release metadata
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          echo "CPA_UI_RELEASE_TAG=cpa-ui-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_ENV"
          {
            echo "CPA UI fork build"
            echo
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
          } > release-notes.md

      - name: Create latest management HTML release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CPA_UI_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.CPA_UI_RELEASE_TAG }}
          files: dist/management.html
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
